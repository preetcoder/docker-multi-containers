apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-app-deployment
  labels:
    app: php-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php-app
  template:
    metadata:
      labels:
        app: php-app
    spec:
      containers:
        # main app
      - name: php-app-container
        image: codepreet/docker_php_multi_containers:02
        env:
          - name: MYSQL_HOST
            value: 127.0.0.1
          - name: MYSQL_USER
            value: root
          - name: MYSQL_PASSWORD
            value: secret
          - name: MYSQL_DB
            value: mobile
        ports:
        - containerPort: 80

        #db persistance
      - name: db
        image: mysql:8.0
        env:
          - name: MYSQL_ROOT_PASSWORD
            value: secret
          - name: MYSQL_DATABASE
            value: mobile
