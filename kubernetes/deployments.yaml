apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-app-deployment
  labels:
    app: php-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: php-app
  template:
    metadata:
      labels:
        app: php-app
    spec:
      containers:
        # main app
      - name: php-app-container
        image: codepreet/docker_php_multi_containers:03
        env:
          - name: MYSQL_HOST
            value: mysql-service
          - name: MYSQL_USER
            value: root
          - name: MYSQL_PASSWORD
            value: secret
          - name: MYSQL_DB
            value: mobile
        ports:
        - containerPort: 80
          name: php-app-port

      #   #db persistance
